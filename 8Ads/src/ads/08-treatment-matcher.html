<!-- Ad 8 · "Not sure where to start?" treatment finder · mechanic: drag each concern onto the treatment often used for it (tap-tap also works). -->
<script type="application/json" id="meta">
{
  "title": "Treatment Matcher · Sanjay Rithik Hospital",
  "mechanic": "Drag & drop match",
  "face": false,
  "gaugeLabel": "MATCH",
  "concern": "help choosing the right treatment",
  "endTitle": "Perfect match!",
  "endSub": "In real life, the right match depends on your skin. Dr. Kiruthika recommends after a free assessment."
}
</script>

<style>
#chip{display:none}
.cards{position:absolute;left:12px;right:12px;top:76px;bottom:30px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.landscape .cards{top:78px;bottom:14px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 8px 34px;border-radius:20px;background:#fff;
  box-shadow:0 6px 16px rgba(11,52,66,.1);text-align:center;transition:transform .15s,box-shadow .15s,background .25s}
.card svg{width:64px;height:64px;flex:none;margin-bottom:2px}
.landscape .card svg{width:46px;height:46px}
.card b{font-size:14px;line-height:1.1;letter-spacing:-.01em}
.card small{font-size:9.5px;font-weight:700;opacity:.55;line-height:1.1}
.card .slot{position:absolute;left:8px;right:8px;bottom:8px;height:26px;border-radius:13px;border:2px dashed #BFDDE0;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:transparent;transition:all .25s}
.card.hover{transform:scale(1.04);box-shadow:0 0 0 3px var(--teal),0 10px 24px rgba(15,141,186,.25)}
.card.ok{background:linear-gradient(160deg,#F0FBFA,#D7F2EF)}
.card.ok .slot{border:0;background:var(--teal);color:#fff}
.card.no{animation:wobble .4s ease}
.card.sel-target{box-shadow:0 0 0 2px #BFDDE0,0 6px 16px rgba(11,52,66,.1)}
.pool{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cn{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 10px;font-size:13.5px;touch-action:none;cursor:grab;letter-spacing:-.01em}
.cn::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--coral);flex:none}
.cn.gone{visibility:hidden}
.cn.lift{opacity:.3}
.cn.sel{background:var(--ink);color:#fff}
.ghost{position:absolute;z-index:4;pointer-events:none;margin:0;transform:translate(-50%,-50%) scale(1.06) rotate(-2deg);box-shadow:0 14px 28px rgba(11,52,66,.3)}
.ghost.fly{transition:left .32s cubic-bezier(.3,1.2,.5,1),top .32s cubic-bezier(.3,1.2,.5,1),transform .32s,opacity .32s}
.pairs{list-style:none;margin:0;padding:0;display:grid;gap:5px;width:100%;max-width:300px}
.pairs li{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,250,245,.1);border:1px solid rgba(255,250,245,.16);border-radius:12px;padding:6px 10px;font-size:12px}
.pairs li span{font-weight:800;color:#8FE3D8;text-align:right}
</style>

<template data-slot="hero">
<div class="cards" id="cards">
  <div class="card" data-k="scars"><svg viewBox="0 0 44 44" aria-hidden="true"><rect x="16" y="4" width="12" height="26" rx="6" fill="#0F8DBA"/><rect x="14" y="28" width="16" height="6" rx="2" fill="#27B8C4"/><g fill="#0B3442"><circle cx="17" cy="38" r="1.2"/><circle cx="22" cy="38" r="1.2"/><circle cx="27" cy="38" r="1.2"/><circle cx="19.5" cy="41" r="1.2"/><circle cx="24.5" cy="41" r="1.2"/></g></svg><b>Microneedling / MNRF</b><small>collagen &amp; texture care</small><span class="slot"></span></div>
  <div class="card" data-k="hair"><svg viewBox="0 0 44 44" aria-hidden="true"><rect x="15" y="3" width="14" height="24" rx="7" fill="#27B8C4"/><rect x="13" y="25" width="18" height="7" rx="3" fill="#0F8DBA"/><path d="M22 34v6M15 35l-3 4M29 35l3 4" stroke="#EE7A5B" stroke-width="2.4" stroke-linecap="round"/></svg><b>Triple Wave laser</b><small>long-term hair reduction</small><span class="slot"></span></div>
  <div class="card" data-k="dull"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M22 5s-10 12-10 19a10 10 0 0 0 20 0C32 17 22 5 22 5z" fill="#8FE3D8"/><path d="M16 25a6 6 0 0 0 5 5.6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="34" cy="10" r="2" fill="#FFC54D"/><circle cx="9" cy="14" r="1.5" fill="#FFC54D"/></svg><b>HydraFacial</b><small>no-needle cleansing facial</small><span class="slot"></span></div>
  <div class="card" data-k="pig"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="15" fill="none" stroke="#0F8DBA" stroke-width="2.4"/><path d="M22 3v9M22 32v9M3 22h9M32 22h9" stroke="#0F8DBA" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="22" cy="22" rx="5" ry="4" fill="#8A5A3C"/></svg><b>Q-Switched laser</b><small>Nd:YAG for pigment</small><span class="slot"></span></div>
</div>
</template>

<template data-slot="panel">
<h1 class="headline"><em>Drag</em> each concern to <mark>its care</mark></h1>
<div class="pool" id="pool">
  <button class="tapbtn cn" type="button" data-k="hair">Unwanted hair</button>
  <button class="tapbtn cn" type="button" data-k="pig">Dark patches</button>
  <button class="tapbtn cn" type="button" data-k="scars">Acne scars</button>
  <button class="tapbtn cn" type="button" data-k="dull">Dull skin</button>
</div>
</template>

<script>
(() => {
  'use strict';
  const { $, $$, Sound, buzz } = SR;
  const NAMES = { scars: ['Acne scars', 'Microneedling / MNRF'], hair: ['Unwanted hair', 'Triple Wave laser'], dull: ['Dull skin', 'HydraFacial'], pig: ['Dark patches', 'Q-Switched laser'] };
  const CAPS = ['Not sure where to start?', 'Nice! 1 of 4 matched', 'Great! 2 of 4 matched', 'Almost! 3 of 4 matched', 'All matched!'];
  let stage, cards, chips, ghost = null, drag = null, sel = null, matched = 0, finishing = 0;

  const stageXY = e => { const s = stage.getBoundingClientRect(); return { x: (e.clientX - s.left) / SR.scale, y: (e.clientY - s.top) / SR.scale }; };
  const cardAt = p => cards.find(c => { const r = SR.rectOf(c); return !c.classList.contains('ok') && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; });

  function makeGhost(chip, p) {
    ghost = chip.cloneNode(true);
    ghost.classList.add('ghost'); ghost.classList.remove('sel', 'lift');
    const r = SR.rectOf(chip);
    ghost.style.width = r.w + 'px'; ghost.style.left = p.x + 'px'; ghost.style.top = p.y + 'px';
    stage.appendChild(ghost);
  }
  function fly(to, cb, fade) {
    const g = ghost; ghost = null;
    g.classList.add('fly');
    requestAnimationFrame(() => {
      g.style.left = to.x + 'px'; g.style.top = to.y + 'px';
      g.style.transform = 'translate(-50%,-50%) scale(' + (fade ? .7 : 1) + ')';
      if (fade) g.style.opacity = 0;
    });
    setTimeout(() => { g.remove(); cb && cb(); }, 330);
  }
  function attempt(chip, card) {
    const k = chip.getAttribute('data-k');
    if (card.getAttribute('data-k') === k) {
      card.classList.add('ok');
      card.querySelector('.slot').textContent = NAMES[k][0];
      chip.classList.add('gone'); chip.classList.remove('lift', 'sel');
      matched++;
      const r = SR.rectOf(card);
      SR.burst(r.cx, r.cy, 16, { speed: 150, size: 7, life: .7 });
      Sound.chime(matched - 1); buzz(15);
      SR.caption(CAPS[matched]);
      if (matched >= 4) finishing = .6;
      return true;
    }
    card.classList.remove('no'); void card.offsetWidth; card.classList.add('no');
    chip.classList.remove('lift', 'sel');
    Sound.err(); buzz(25);
    return false;
  }
  function clearHover() { cards.forEach(c => c.classList.remove('hover')); }

  function onDown(e) {
    const chip = e.currentTarget;
    if (SR.done || finishing || chip.classList.contains('gone')) return;
    e.preventDefault();
    SR.interact();
    const p = stageXY(e);
    drag = { chip, id: e.pointerId, sx: p.x, sy: p.y, moved: false };
    try { chip.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const p = stageXY(e);
    if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) > 6) {
      drag.moved = true;
      if (sel) { sel.classList.remove('sel'); sel = null; }
      drag.chip.classList.add('lift');
      makeGhost(drag.chip, p);
      Sound.click();
    }
    if (drag.moved) {
      ghost.style.left = p.x + 'px'; ghost.style.top = p.y + 'px';
      clearHover(); const c = cardAt(p); if (c) c.classList.add('hover');
      SR.poke();
    }
  }
  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    clearHover();
    if (!d.moved) { // tap-to-select, then tap a card
      if (sel === d.chip) { sel.classList.remove('sel'); sel = null; return; }
      if (sel) sel.classList.remove('sel');
      sel = d.chip; sel.classList.add('sel'); Sound.click();
      return;
    }
    const p = stageXY(e), c = cardAt(p);
    if (c && attempt(d.chip, c)) { const r = SR.rectOf(c.querySelector('.slot')); fly({ x: r.cx, y: r.cy }, null, true); }
    else { const r = SR.rectOf(d.chip); fly({ x: r.cx, y: r.cy }, () => d.chip.classList.remove('lift')); }
  }

  SR.register({
    init() {
      stage = $('#stage'); cards = $$('.card'); chips = $$('.cn');
      chips.forEach(ch => {
        ch.addEventListener('pointerdown', onDown);
        ch.addEventListener('pointermove', onMove);
        ch.addEventListener('pointerup', onUp);
        ch.addEventListener('pointercancel', () => { if (drag && drag.moved && ghost) { const r = SR.rectOf(drag.chip); const c = drag.chip; fly({ x: r.cx, y: r.cy }, () => c.classList.remove('lift')); } drag = null; clearHover(); });
      });
      cards.forEach(c => c.addEventListener('click', () => { if (sel && !c.classList.contains('ok') && !SR.done) { SR.interact(); const s = sel; sel = null; attempt(s, c); } }));
      SR.caption(CAPS[0]);
    },
    /* the hand shows one correct drag, from the first unmatched concern to its card */
    tutorial() {
      const chip = chips.find(c => !c.classList.contains('gone'));
      if (!chip) return null;
      const card = cards.find(c => c.getAttribute('data-k') === chip.getAttribute('data-k'));
      const a = SR.rectOf(chip), b = SR.rectOf(card);
      return SR.dragPath(a.cx, a.cy, b.cx, b.cy, 2.8);
    },
    frame(dt) {
      SR.progress(matched / 4);
      if (finishing) { finishing -= dt; if (finishing <= 0) { finishing = 0; SR.complete(); } }
    },
    reset() {
      matched = 0; finishing = 0; sel = null;
      cards.forEach(c => { c.classList.remove('ok', 'hover', 'no'); c.querySelector('.slot').textContent = ''; });
      chips.forEach(c => c.classList.remove('gone', 'lift', 'sel'));
      SR.caption(CAPS[0]);
    },
    endArt() {
      return '<ul class="pairs">' + Object.values(NAMES).map(([a, b]) => `<li>${a}<span>${b}</span></li>`).join('') + '</ul>';
    }
  });
})();
</script>
