<!-- Ad 4 · Hair fall / PRP · mechanic: press and hold; shedding slows, the part narrows and the hair fills in. -->
<script type="application/json" id="meta">
{
  "title": "Hair Fall Hold · Sanjay Rithik Hospital",
  "mechanic": "Press & hold",
  "face": true,
  "gaugeLabel": "ROOTS",
  "concern": "hair fall",
  "endTitle": "Hair-fall plan, unlocked!",
  "endSub": "Hair fall has a cause. Dr. Kiruthika finds yours first, then explains options like PRP."
}
</script>

<style>
.holdwrap{display:flex;align-items:center;justify-content:center;gap:16px}
.hold{position:relative;width:96px;height:96px;border-radius:50%;border:0;padding:0;cursor:pointer;background:none;touch-action:none;flex:none}
.hold svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hold .r-bg{fill:none;stroke:#DCEFF0;stroke-width:8}
.hold .r-fg{fill:none;stroke:url(#hgRing);stroke-width:8;stroke-linecap:round;stroke-dasharray:263.9;stroke-dashoffset:263.9}
.hold .core{position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3FCAD3,#0F8DBA 70%);box-shadow:0 6px 0 #0B6A8C,0 14px 26px rgba(15,141,186,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:transform .12s,box-shadow .12s}
.hold .core svg{width:26px;height:26px}
.hold .core b{font-size:11px;letter-spacing:.2em;margin-top:2px}
.hold.on .core{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 #0B6A8C,0 8px 18px rgba(15,141,186,.35)}
.hold.idle::after{content:"";position:absolute;inset:6px;border-radius:50%;border:3px solid var(--teal);animation:ping 1.6s ease-out infinite}
.holdtxt{max-width:150px;font-size:12.5px;font-weight:700;line-height:1.3;opacity:.75}
.holdtxt b{display:block;font-size:15px;opacity:1;color:var(--ink)}
</style>

<template data-slot="hero">
<svg class="art" id="art" viewBox="14 26 252 326" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" aria-label="Illustrated woman whose hair fall slows and hair fills in"><g id="face"></g><g id="roots"></g><g id="fall" fill="none" stroke="#2A1520" stroke-width="1.5" stroke-linecap="round"></g></svg>
</template>

<template data-slot="panel">
<h1 class="headline"><em>Hold</em> to power up your <mark>hair-fall plan</mark></h1>
<div class="holdwrap">
  <button class="hold idle" id="hold" type="button" aria-label="Press and hold">
    <svg class="ring" viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="hgRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#27B8C4"/><stop offset="1" stop-color="#FFC54D"/></linearGradient></defs><circle class="r-bg" cx="48" cy="48" r="42"/><circle class="r-fg" id="ringFg" cx="48" cy="48" r="42"/></svg>
    <span class="core"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z" fill="#fff"/><path d="M9 14.5a3 3 0 0 0 2 2.8" stroke="#0F8DBA" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><b>HOLD</b></span>
  </button>
  <div class="holdtxt" id="holdtxt"><b>Press &amp; hold</b>Find the cause, then strengthen the roots</div>
</div>
</template>

<script>
(() => {
  'use strict';
  const { $, clamp, lerp, smooth, f2, el, Sound, buzz } = SR;
  const HOLD_SECS = 3.4;
  const CAPS = [[0, 'Today · Extra shedding, wider part'], [.04, 'Step 1 · The cause is found first'], [.36, 'Step 2 · A plan for your scalp'], [.68, 'Step 3 · Medicines or PRP, as advised'], [1, 'Fuller-looking hair, step by step*']];
  const TXT = [[0, '<b>Press &amp; hold</b>Find the cause, then strengthen the roots'], [.04, '<b>Keep holding…</b>Roots are getting support'], [.6, '<b>Almost there!</b>Keep holding'], [1, '<b>Done!</b>Your plan is ready']];

  let face, blink, art, fallG, rootsG, holdBtn, ringFg, holdTxt;
  let p = 0, shown = 0, holding = false, spawnAcc = 0, strands = [], lastCap = -1, lastTxt = -1, lastTick = 0, finishing = 0, ghostT = -1, sparks = [];

  function spawnStrand() {
    /* strands leave the outer edge of the hair and drift out over the light background, where they read clearly */
    const side = Math.random() < .5 ? -1 : 1;
    const y = 110 + Math.random() * 120, x = 140 + side * (84 + Math.random() * 6 + (y - 110) * .02);
    const L = 18 + Math.random() * 14, c = (Math.random() - .5) * 16;
    const e = el('path', { d: `M0,0 Q${f2(c)},${f2(L / 2)} ${f2(c * .3)},${f2(L)}`, opacity: 0 }, fallG);
    strands.push({ e, x, y, vx: side * (14 + Math.random() * 16), vy: 14 + Math.random() * 12, rot: side * (20 + Math.random() * 40), vr: side * (30 + Math.random() * 60), t: 0 });
  }
  function press(e) {
    if (SR.done || finishing) return;
    e.preventDefault();
    SR.interact();
    holding = true; ghostT = -1;
    holdBtn.classList.add('on'); holdBtn.classList.remove('idle');
    try { holdBtn.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function release() { holding = false; holdBtn.classList.remove('on'); SR.poke(); }

  SR.register({
    init() {
      art = $('#art'); fallG = $('#fall'); rootsG = $('#roots'); holdBtn = $('#hold'); ringFg = $('#ringFg'); holdTxt = $('#holdtxt');
      face = Face.mount($('#face'), { part: true, seed: 3 });
      blink = Face.blinker();
      holdBtn.addEventListener('pointerdown', press);
      holdBtn.addEventListener('pointerup', release);
      holdBtn.addEventListener('pointercancel', release);
      holdBtn.addEventListener('lostpointercapture', release);
      holdBtn.addEventListener('contextmenu', e => e.preventDefault());
      holdBtn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); SR.interact(); holding = true; holdBtn.classList.add('on'); } });
      holdBtn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') release(); });
      for (let i = 0; i < 6; i++) spawnStrand();
    },
    /* the hand presses and holds; the ring previews a little progress, then lets go */
    tutorial(isGhost) {
      const r = SR.rectOf(holdBtn);
      ghostT = isGhost ? 0 : -1;
      if (!isGhost) holdBtn.classList.add('idle');
      return t => {
        const c = t % 2.6;
        if (isGhost) ghostT = c;
        if (c < .3) return { x: r.cx + 24 * (1 - c / .3), y: r.cy + 28 * (1 - c / .3), a: c / .3 };
        if (c < 1.6) return { x: r.cx, y: r.cy, a: 1, press: true };
        if (c < 2) return { x: r.cx, y: r.cy, a: 1 - (c - 1.6) / .4 };
        return { x: r.cx, y: r.cy, a: 0 };
      };
    },
    tutorialEnd() { ghostT = -1; holdBtn.classList.remove('idle'); },
    frame(dt, T) {
      if (holding && !SR.done && !finishing) {
        p = Math.min(1, p + dt / HOLD_SECS);
        if (SR.userDriven() && T - lastTick > .16) { lastTick = T; Sound.tick(Math.floor(p * 14)); buzz(5); }
        if (Math.random() < dt * 16) { // sparkles rising at the roots while charging
          const x = 140 + (Math.random() - .5) * 90, y = 70 + Math.random() * 40;
          sparks.push({ e: el('circle', { cx: f2(x), cy: f2(y), r: 1.6, fill: '#FFE7A0' }, rootsG), y, t: 0 });
        }
      }
      const preview = ghostT >= 0 ? .18 * smooth(.3, 1.6, ghostT) * (1 - smooth(1.6, 2, ghostT)) : 0;
      const vis = Math.max(p, preview);
      shown += (vis - shown) * (1 - Math.exp(-8 * dt));
      holdBtn.classList.toggle('on', holding || (ghostT > .3 && ghostT < 1.6));
      ringFg.style.strokeDashoffset = (263.9 * (1 - shown)).toFixed(2);

      /* shedding: plenty at first, almost none once the plan is charged */
      spawnAcc += dt * lerp(5, .15, smooth(0, .9, p));
      while (spawnAcc > 1) { spawnAcc--; if (strands.length < 24) spawnStrand(); }
      for (let i = strands.length - 1; i >= 0; i--) {
        const s = strands[i];
        s.t += dt; s.vy += 38 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
        s.e.setAttribute('transform', `translate(${f2(s.x)} ${f2(s.y)}) rotate(${f2(s.rot)})`);
        s.e.setAttribute('opacity', f2(Math.min(1, s.t * 4) * (1 - smooth(300, 352, s.y)) * .85));
        if (s.y > 352) { s.e.remove(); strands.splice(i, 1); }
      }
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.t += dt;
        s.e.setAttribute('cy', f2(s.y - 30 * s.t));
        s.e.setAttribute('opacity', f2(Math.max(0, 1 - s.t / .8)));
        if (s.t > .8) { s.e.remove(); sparks.splice(i, 1); }
      }

      face.set({ hair: smooth(0, 1, shown), glow: smooth(.5, 1, shown), dull: .4 * (1 - shown), smile: smooth(.75, 1, shown), blink: blink(dt), t: T,
        rays: SR.reduceMotion ? 0 : (T * 5) % 360, bob: Math.sin(T * 1.7) * .9 });
      SR.progress(p);
      let ci = 0; CAPS.forEach(([th], i) => { if (p >= th) ci = i; });
      if (ci !== lastCap) { lastCap = ci; SR.caption(CAPS[ci][1]); }
      let ti = 0; TXT.forEach(([th], i) => { if (p >= th) ti = i; });
      if (!holding && p > 0 && p < 1) ti = -2;
      if (ti !== lastTxt) { lastTxt = ti; holdTxt.innerHTML = ti === -2 ? '<b>Keep going!</b>Press &amp; hold to continue' : TXT[ti][1]; }
      if (!finishing && !SR.done && p >= 1) { finishing = .4; holding = false; holdBtn.classList.remove('on'); }
      if (finishing) { finishing -= dt; if (finishing <= 0) { finishing = 0; SR.complete(); } }
    },
    reset() { p = shown = 0; holding = false; finishing = 0; lastTxt = -1; },
    endArt() {
      return `<figure class="e-portrait"><img alt="Illustrated woman with fuller-looking hair" src="${Face.render({ part: true, seed: 3 }, { hair: 1, glow: 1, smile: 1 })}"><figcaption>YOUR PLAN</figcaption></figure>`;
    }
  });
})();
</script>
